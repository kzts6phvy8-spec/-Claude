<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>スクショメモ</title>
<meta name="description" content="スクリーンショットをAI（Gemini Flash-Lite）でテキスト化してメモにするチャットアプリ">
<meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f1e1c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="スクショメモ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --bg: #faf8f5;
    --surface: #ffffff;
    --surface-2: #f2eee8;
    --text: #1f1e1c;
    --muted: #6f6b64;
    --border: #e4ded5;
    --accent: #c9643f;
    --accent-text: #ffffff;
    --user-bubble: #efe9e1;
    --danger: #b3261e;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f1e1c;
      --surface: #2a2926;
      --surface-2: #33312d;
      --text: #f1ede7;
      --muted: #a8a299;
      --border: #3d3a35;
      --accent: #e0805c;
      --accent-text: #1f1e1c;
      --user-bubble: #3a3733;
      --danger: #f2a49d;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    font-size: 16px;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* ヘッダー */
  header {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: calc(env(safe-area-inset-top) + 8px) 16px 8px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  header h1 { flex: 1; margin: 0; font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  header h1 img { width: 26px; height: 26px; border-radius: 7px; }
  .icon-btn {
    border: none; background: transparent; padding: 8px; border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center; min-width: 40px; min-height: 40px;
  }
  .icon-btn:active { background: var(--surface-2); }
  .icon-btn svg { width: 22px; height: 22px; }

  /* チャット */
  #chat { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 16px 8px; }
  .inner { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  .welcome { text-align: center; padding: 32px 8px; color: var(--muted); }
  .welcome img { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 12px; }
  .welcome h2 { color: var(--text); font-size: 20px; margin: 0 0 8px; }
  .welcome ol { text-align: left; display: inline-block; margin: 12px 0 0; padding-left: 1.4em; }
  .welcome li { margin: 4px 0; }

  .msg-user { align-self: flex-end; max-width: 85%; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .msg-user .bubble { background: var(--user-bubble); padding: 10px 14px; border-radius: 18px 18px 4px 18px; white-space: pre-wrap; word-break: break-word; }
  .thumbs { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
  .thumbs img { width: 56px; height: 100px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }

  .msg-model { align-self: flex-start; width: 100%; }
  .msg-model .plain { white-space: pre-wrap; word-break: break-word; padding: 2px 2px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: var(--shadow); overflow: hidden;
  }
  .card-head { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .card-head img { width: 32px; height: 56px; object-fit: cover; border-radius: 5px; border: 1px solid var(--border); flex: none; }
  .card-title { flex: 1; font-weight: 600; font-size: 15px; line-height: 1.4; word-break: break-word; }
  .card-date { font-size: 12px; color: var(--muted); font-weight: 400; display: block; }
  .card-body { padding: 12px; white-space: pre-wrap; word-break: break-word; font-size: 15px; max-height: 320px; overflow-y: auto; }
  .card-body.expanded { max-height: none; }
  .card-actions { display: flex; gap: 4px; padding: 6px 8px; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .chip {
    border: none; background: transparent; color: var(--muted); padding: 6px 10px; border-radius: 8px;
    font-size: 13px; display: inline-flex; align-items: center; gap: 4px;
  }
  .chip:active { background: var(--surface-2); }
  .chip.primary { color: var(--accent); font-weight: 600; }
  .chip svg { width: 16px; height: 16px; }
  .chip.right { margin-left: auto; }

  .error { color: var(--danger); background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
  .loading { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; padding: 10px 12px; }
  .dots { flex: none; white-space: nowrap; }
  .dots span { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 3px; animation: blink 1.2s infinite both; }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }

  /* 入力欄 */
  footer { flex: none; padding: 8px 12px calc(env(safe-area-inset-bottom) + 8px); background: var(--bg); }
  .composer {
    max-width: 720px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border);
    border-radius: 22px; box-shadow: var(--shadow); padding: 6px;
  }
  #pending { display: none; gap: 6px; padding: 6px 6px 2px; overflow-x: auto; }
  #pending.show { display: flex; }
  .pend { position: relative; flex: none; }
  .pend img { width: 52px; height: 92px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); display: block; }
  .pend button {
    position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%;
    border: none; background: var(--text); color: var(--bg); font-size: 13px; line-height: 22px; padding: 0;
  }
  .row { display: flex; align-items: flex-end; gap: 4px; }
  #input {
    flex: 1; border: none; outline: none; resize: none; background: transparent; color: var(--text);
    font: inherit; font-size: 16px; line-height: 1.5; padding: 8px 4px; max-height: 140px; min-height: 40px;
  }
  #input::placeholder { color: var(--muted); }
  #send {
    width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--accent); color: var(--accent-text);
    display: inline-flex; align-items: center; justify-content: center; margin: 2px; flex: none;
  }
  #send:disabled { opacity: .35; }
  #send svg { width: 18px; height: 18px; }
  .note { text-align: center; font-size: 11px; color: var(--muted); margin-top: 6px; }

  /* 読み取り形式の切り替え */
  .modebar { max-width: 720px; margin: 0 auto 6px; display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
  .seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 2px; }
  .seg button { border: none; background: transparent; padding: 4px 12px; border-radius: 999px; font-size: 13px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow); }

  /* 一括保存バー */
  .savebar {
    max-width: 720px; margin: 0 auto 8px; display: none; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 8px 8px 8px 14px; box-shadow: var(--shadow);
  }
  .savebar.show { display: flex; }
  .savebar span { flex: 1; font-size: 14px; }
  .savebar b { color: var(--accent); }
  .tag.saved { background: #dcefdc; color: #2d6a2d; }
  .pend.more {
    width: 52px; height: 92px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2);
    display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: var(--muted);
  }
  .savebar .btn[hidden] { display: none; }
  .dlg select {
    font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-weight: 400;
  }

  /* クイズカード */
  .quiz-q { display: flex; gap: 8px; }
  .quiz-a { display: flex; gap: 8px; margin-top: 10px; align-items: baseline; flex-wrap: wrap; }
  .badge { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 5px; color: #fff; font-weight: 700; font-size: 13px; line-height: 1; }
  .badge.q { background: #f0a030; }
  .badge.a { background: #e05050; }
  .quiz-answer { color: #d94848; font-weight: 700; font-size: 17px; }
  .quiz-sub { color: var(--muted); font-size: 14px; }
  @media (prefers-color-scheme: dark) { .quiz-answer { color: #ff8a80; } }
  .tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; margin-left: 6px; vertical-align: 2px; background: var(--surface-2); color: var(--muted); }
  .tag.dup { background: #fde6c8; color: #8a4b00; }

  /* 設定ダイアログ */
  dialog {
    border: none; border-radius: 18px; padding: 0; width: min(440px, calc(100vw - 32px));
    background: var(--surface); color: var(--text); box-shadow: 0 10px 40px rgba(0,0,0,.25);
  }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  .dlg { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .dlg h2 { margin: 0; font-size: 18px; }
  .dlg label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; }
  .dlg input {
    font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-weight: 400;
  }
  .dlg small { color: var(--muted); font-weight: 400; font-size: 12px; line-height: 1.5; }
  .dlg a { color: var(--accent); }
  .bgbox { display: flex; flex-direction: column; gap: 8px; padding: 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg); }
  .bgbox b { font-size: 14px; }
  .bgbox .btn { align-self: flex-start; font-size: 14px; padding: 7px 12px; }
  .dlg-buttons { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .btn { border: 1px solid var(--border); background: transparent; padding: 9px 16px; border-radius: 10px; font-size: 15px; }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  .btn.danger { color: var(--danger); }
  .tag.saved { cursor: pointer; }

  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 96px); transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 20px; font-size: 14px;
    opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10; max-width: calc(100vw - 32px);
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1><img src="icon-192.png" alt="">スクショメモ</h1>
  <button class="icon-btn" id="exportAll" aria-label="すべてのメモを書き出す" title="すべて書き出し">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
  </button>
  <button class="icon-btn" id="openSettings" aria-label="設定" title="設定">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</header>

<main id="chat"><div class="inner" id="messages"></div></main>

<footer>
  <div class="savebar" id="statusbar">
    <span id="statusText"></span>
    <button type="button" class="btn" id="retryAll" hidden>まとめて再試行</button>
  </div>
  <div class="savebar" id="savebar">
    <span>未保存のメモ <b id="unsavedCount">0</b> 件</span>
    <button type="button" class="btn primary" id="saveAll">メモアプリに一括保存</button>
  </div>
  <div class="modebar">
    <span>読み取り形式</span>
    <div class="seg" role="group" aria-label="読み取り形式">
      <button type="button" data-mode="quiz">クイズ</button>
      <button type="button" data-mode="general">通常</button>
    </div>
  </div>
  <div class="composer">
    <div id="pending"></div>
    <div class="row">
      <button class="icon-btn" id="attach" aria-label="スクリーンショットを追加" title="スクリーンショットを追加">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>
      </button>
      <textarea id="input" rows="1" placeholder="スクショ追加・メッセージ入力"></textarea>
      <button id="send" aria-label="送信" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
      </button>
    </div>
  </div>
  <div class="note">Gemini Flash-Lite で解析・データは端末内に保存</div>
  <input type="file" id="file" accept="image/*" multiple hidden>
</footer>

<dialog id="settings">
  <form method="dialog" class="dlg" id="settingsForm">
    <h2>設定</h2>
    <label>Gemini APIキー
      <input type="password" id="apiKey" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="AIza...">
      <small><a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a> で無料で発行できます。キーはこの端末のブラウザにだけ保存され、GitHub には公開されません。</small>
    </label>
    <label>メモアプリへの保存方法
      <select id="saveMethod">
        <option value="shortcut">ショートカット経由（おすすめ）</option>
        <option value="share">共有シート（毎回、送り先を手で選ぶ）</option>
      </select>
      <small>「ショートカット経由」は iPhone の「ショートカット」アプリに下記の名前のショートカットを作っておく必要があります（作り方は README 参照）。</small>
    </label>
    <label>まとめ方
      <select id="saveJoin">
        <option value="one">1つのメモにまとめる（おすすめ）</option>
        <option value="each">1問ずつ別のメモにする</option>
      </select>
      <small>「1つのメモにまとめる」は、ショートカットを「メモに追加」に変えると、毎回同じメモの末尾に書き足されます（作り方は README）。</small>
    </label>
    <label>ショートカット名
      <input type="text" id="shortcutName" autocomplete="off" autocapitalize="off" spellcheck="false">
    </label>
    <div class="bgbox">
      <b>バックグラウンド解析（アプリを閉じても解析）</b>
      <small>自分の Google アカウントに無料の解析サーバーを作ると、送信後にアプリを閉じても解析が続きます。<a href="server.html">作り方</a></small>
      <button type="button" class="btn" id="bgCopy">① サーバー用コードをコピー</button>
      <label>② サーバーの URL
        <input type="url" id="bgUrl" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec">
      </label>
      <button type="button" class="btn" id="bgTest">③ 接続テスト</button>
      <small id="bgState"></small>
    </div>
    <label>1分あたりの解析枚数の上限
      <input type="number" id="rpm" inputmode="numeric" min="1" max="1000">
      <small>無料枠は 10 のままがおすすめ（超えるとエラーになります）。有料プランなら 60 などに上げると速くなります。</small>
    </label>
    <label>モデル
      <input type="text" id="model" autocomplete="off" autocapitalize="off" spellcheck="false">
      <small>既定は <code>gemini-flash-lite-latest</code>（最新の Flash-Lite）。固定したい場合は <code>gemini-2.5-flash-lite</code> などを入力。</small>
    </label>
    <div class="dlg-buttons">
      <button type="button" class="btn" id="unsaveAll">保存済みを全部戻す</button>
      <button type="button" class="btn" id="dropSaved" style="margin-right:auto">保存済みを履歴から消す</button>
      <button type="button" class="btn danger" id="clearAll">履歴を全削除</button>
      <button type="button" class="btn" id="cancelSettings">キャンセル</button>
      <button type="submit" class="btn primary">保存</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';

  const DEFAULT_MODEL = 'gemini-flash-lite-latest';
  const KEY_SETTINGS = 'screenmemo.settings';
  const KEY_MESSAGES = 'screenmemo.messages';
  const KEY_SEEN = 'screenmemo.seenQuestions';
  const CONCURRENCY = 2;
  const MAX_PER_BATCH = 500;   // 1回に追加できる枚数（無料枠1日の上限の目安）
  const PREVIEW = 20;          // 入力欄に並べるサムネイルの数
  const DAILY_MSG = '今日の無料枠の上限に達しました。日本時間の夕方（16〜17時）以降に「まとめて再試行」を押してください。';

  const OCR_SYSTEM = [
    'あなたはスマートフォンのスクリーンショットを読み取り、メモとして保存できるテキストに変換するアシスタントです。',
    '・画像内の文章を、改行や箇条書きの構造をできるだけ保って正確に書き起こしてください。',
    '・ステータスバー（時刻・電波・電池）、キーボード、ナビゲーションバー、広告などの本文と無関係な UI は除外してください。',
    '・チャット画面の場合は「名前: 発言」の形式で書き起こしてください。',
    '・内容を推測で補ったり要約したりしないでください（ユーザーから追加の指示がある場合はそれに従ってください）。',
    '・title には内容が一目で分かる20文字程度の日本語のタイトルを付けてください。',
    '・文字が読み取れない場合は text を空文字にしてください。'
  ].join('\n');

  // クイズアプリのスクリーンショット専用の読み取り指示
  const QUIZ_SYSTEM = [
    'これはクイズアプリのスクリーンショット（問題部分を切り出した画像）です。次の部分だけを読み取ってください。',
    '・question: オレンジ色の「Q」マークの右にある問題文。画面上の改行は取り除き、1つの文につなげてください。',
    '・answer: 赤い「A」マークの右にある赤い文字の正解。',
    '・正解の下にある灰色の小さな文字（読みがな・別解）は読み取らないでください。',
    '・プレイヤー名、得点、タイマー、問題番号、キャラクター、メニューなどは無視してください。',
    '・文字は画像のとおり正確に書き写し、推測で補ったり言い換えたりしないでください。',
    '・この形式のクイズ画面でない場合は is_quiz を false にしてください。'
  ].join('\n');

  const CHAT_SYSTEM = [
    'あなたは「スクショメモ」アプリのアシスタントです。',
    'ユーザーはスクリーンショットからテキスト化したメモについて質問したり、要約・整理・翻訳などを依頼します。',
    '会話履歴にあるメモの内容をもとに、日本語で簡潔に答えてください。Markdown の装飾は使わず、プレーンテキストで答えてください。'
  ].join('\n');

  // ---------- 保存 ----------
  const storage = {
    get(key, fallback) {
      try { const v = localStorage.getItem(key); return v == null ? fallback : JSON.parse(v); }
      catch { return fallback; }
    },
    set(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); return true; }
      catch { return false; }
    }
  };

  let settings = Object.assign({ apiKey: '', model: DEFAULT_MODEL, mode: 'quiz', rpm: 10, bgUrl: '', bgToken: '', saveMethod: 'shortcut', saveJoin: 'one', shortcutName: 'スクショメモ保存' }, storage.get(KEY_SETTINGS, {}));
  let messages = storage.get(KEY_MESSAGES, []);
  if (!Array.isArray(messages)) messages = [];
  messages = messages.filter(m => !m.pending);
  let pendingFiles = [];   // { id, file, thumb }
  let busy = 0;

  function saveMessages() {
    updateSaveBar();
    const data = messages.filter(m => !m.pending).map(({ _job, thumbs, ...rest }) => rest);
    if (storage.set(KEY_MESSAGES, data)) return;
    // 容量オーバー時は古いサムネイルから削る
    for (const m of data) {
      if (m.thumb) delete m.thumb;
      if (m.thumbs) delete m.thumbs;
      if (storage.set(KEY_MESSAGES, data)) { toast('保存容量が少ないため古いサムネイルを削除しました'); return; }
    }
    toast('保存に失敗しました。古い履歴を削除してください');
  }

  // ---------- DOM ----------
  const $ = id => document.getElementById(id);
  const chatEl = $('chat'), listEl = $('messages'), inputEl = $('input'), sendEl = $('send');
  const fileEl = $('file'), pendingEl = $('pending'), dlg = $('settings');

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const fmtDate = ts => new Date(ts).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });

  function el(tag, attrs = {}, children = []) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v);
    }
    for (const c of [].concat(children)) if (c) e.append(c);
    return e;
  }

  const ICONS = {
    copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
    share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>',
    expand: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
    retry: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>'
  };
  function chip(icon, label, onclick, cls = '') {
    const b = el('button', { class: 'chip ' + cls, type: 'button', onclick });
    b.innerHTML = ICONS[icon];
    b.append(label);
    return b;
  }

  // ---------- 描画 ----------
  function render() {
    listEl.replaceChildren();
    if (!messages.length) {
      const w = el('div', { class: 'welcome' }, [
        el('img', { src: 'icon-192.png', alt: '' }),
        el('h2', { text: 'スクショをテキストに' }),
        el('div', { text: 'スクリーンショットを送ると、AI が文字を読み取ってメモにします。' }),
        el('ol', {}, [
          el('li', { text: settings.apiKey ? '✓ APIキー設定済み' : '右上の ⚙ から Gemini APIキーを設定' }),
          el('li', { text: '左下の画像ボタンでスクショを選択（複数可）' }),
          el('li', { text: '送信 → 下の「メモアプリに一括保存」でメモアプリへ' }),
          el('li', { text: '保存したら写真アプリでスクショを削除して容量を空ける' })
        ])
      ]);
      listEl.append(w);
      return;
    }
    for (const m of messages) listEl.append(renderMessage(m));
  }

  function renderMessage(m) {
    if (m.role === 'user') {
      const wrap = el('div', { class: 'msg-user', 'data-id': m.id });
      if (m.thumbs && m.thumbs.length) {
        wrap.append(el('div', { class: 'thumbs' }, m.thumbs.map(src => el('img', { src, alt: 'スクリーンショット' }))));
        if (m.imageCount > m.thumbs.length) wrap.append(el('div', { class: 'bubble', text: `🖼 全${m.imageCount}枚` }));
      } else if (m.imageCount) {
        wrap.append(el('div', { class: 'bubble', text: `🖼 スクリーンショット ${m.imageCount}枚` }));
      }
      if (m.text) wrap.append(el('div', { class: 'bubble', text: m.text }));
      return wrap;
    }

    const wrap = el('div', { class: 'msg-model', 'data-id': m.id });
    if (m.kind === 'remote') {
      const dots = el('span', { class: 'dots' }); dots.innerHTML = '<span></span><span></span><span></span>';
      wrap.append(el('div', { class: 'card' }, [
        el('div', { class: 'card-head' }, [
          m.thumb ? el('img', { src: m.thumb, alt: '' }) : null,
          el('div', { class: 'loading', style: 'flex:1;padding:0' }, [dots, el('span', { text: 'サーバーで解析待ち（アプリを閉じても続きます）' })]),
          chip('trash', '取消', () => { callServer('cancel', { ids: [m.id] }).catch(() => {}); removeMessage(m.id); })
        ])
      ]));
      return wrap;
    }
    if (m.pending) {
      const dots = el('span', { class: 'dots' }); dots.innerHTML = '<span></span><span></span><span></span>';
      wrap.append(el('div', { class: m.kind === 'ocr' ? 'card' : '' }, [
        el('div', { class: 'loading' }, [dots, el('span', { text: m.kind === 'ocr' ? '文字を読み取っています…' : '考えています…' })])
      ]));
      return wrap;
    }
    if (m.kind === 'error') {
      const box = el('div', { class: 'error', text: '⚠️ ' + m.text });
      wrap.append(box);
      if (m.retry) {
        const actions = el('div', { class: 'card-actions', style: 'border:none;padding:4px 0' }, [
          chip('retry', '再試行', () => retry(m), 'primary'),
          chip('trash', '削除', () => removeMessage(m.id), 'right')
        ]);
        wrap.append(actions);
      }
      return wrap;
    }
    if (m.kind === 'ocr') {
      const body = m.quiz ? renderQuizBody(m.quiz) : el('div', { class: 'card-body', text: m.text || (m.skip ? '（クイズ画面ではなかったため、メモにしません）' : '（文字が見つかりませんでした）') });
      const actions = m.skip ? el('div', { class: 'card-actions' }) : el('div', { class: 'card-actions' }, [
        chip('share', '共有', async () => {
          if (await shareText(m.quiz ? '' : m.title, m.text)) { markSaved(m); saveMessages(); updateMessage(m); }
        }, 'primary'),
        chip('copy', 'コピー', () => copyText(m.text)),
      ]);
      if (!m.quiz && (m.text || '').length > 400) {
        actions.append(chip('expand', '全文', (e) => {
          body.classList.toggle('expanded');
          e.currentTarget.lastChild.textContent = body.classList.contains('expanded') ? '閉じる' : '全文';
        }));
      }
      actions.append(chip('trash', '削除', () => removeMessage(m.id), 'right'));
      wrap.append(el('div', { class: 'card' }, [
        el('div', { class: 'card-head' }, [
          m.thumb ? el('img', { src: m.thumb, alt: '' }) : null,
          el('div', { class: 'card-title' }, [
            document.createTextNode(m.title || 'メモ'),
            m.quiz ? el('span', { class: 'tag', text: 'クイズ' }) : null,
            m.duplicate ? el('span', { class: 'tag dup', text: '重複' }) : null,
            m.saved ? el('span', { class: 'tag saved', text: '保存済み ×', role: 'button', onclick: () => {
              if (!confirm('「保存済み」を取り消して、もう一度一括保存の対象にしますか？')) return;
              m.saved = false; saveMessages(); updateMessage(m);
            } }) : null,
            el('span', { class: 'card-date', text: fmtDate(m.at) })
          ])
        ]),
        body,
        actions
      ]));
      return wrap;
    }
    // 通常のチャット返答
    wrap.append(el('div', { class: 'plain', text: m.text }));
    wrap.append(el('div', { class: 'card-actions', style: 'border:none;padding:2px 0' }, [
      chip('copy', 'コピー', () => copyText(m.text)),
      chip('share', '共有', () => shareText('', m.text))
    ]));
    return wrap;
  }

  function renderQuizBody(q) {
    const a = el('div', { class: 'quiz-a' }, [
      el('span', { class: 'badge a', text: 'A' }),
      el('span', { class: 'quiz-answer', text: q.answer || '（読み取れませんでした）' }),
    ]);
    return el('div', { class: 'card-body expanded' }, [
      el('div', { class: 'quiz-q' }, [el('span', { class: 'badge q', text: 'Q' }), el('span', { text: q.question })]),
      a
    ]);
  }

  function formatQuiz(q) {
    return `Q. ${q.question}\nA. ${q.answer}`;
  }

  const normalize = t => (t || '').replace(/[\s\u3000、。，．,.・「」『』？?！!]/g, '');

  // 履歴から消した保存済みの問題も覚えておく（同じ問題をもう一度送っても二重保存しない）
  const seenQuestions = new Set(storage.get(KEY_SEEN, []));
  function rememberSaved(list) {
    list.forEach(m => { if (m.saved && m.quiz) seenQuestions.add(normalize(m.quiz.question)); });
    if (!storage.set(KEY_SEEN, [...seenQuestions])) toast('保存容量が足りず、重複チェック用の記録を保存できませんでした');
  }

  function isDuplicateQuiz(q, self) {
    const key = normalize(q.question);
    if (!key) return false;
    return seenQuestions.has(key) || messages.some(m => m !== self && m.quiz && !m.duplicate && normalize(m.quiz.question) === key);
  }

  function updateMessage(m) {
    const old = listEl.querySelector(`[data-id="${m.id}"]`);
    if (old) old.replaceWith(renderMessage(m)); else render();
  }

  function addMessage(m) {
    if (!messages.length) listEl.replaceChildren();
    messages.push(m);
    listEl.append(renderMessage(m));
    scrollToBottom();
  }

  function removeMessage(id) {
    messages = messages.filter(m => m.id !== id);
    saveMessages();
    render();
  }

  function scrollToBottom() {
    requestAnimationFrame(() => { chatEl.scrollTop = chatEl.scrollHeight; });
  }

  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  // ---------- コピー / 共有 ----------
  async function copyText(text, silent) {
    try { await navigator.clipboard.writeText(text); }
    catch {
      const ta = el('textarea', { style: 'position:fixed;opacity:0' }); ta.value = text;
      document.body.append(ta); ta.select(); document.execCommand('copy'); ta.remove();
    }
    if (!silent) toast('コピーしました');
  }

  // 共有できたら true
  async function shareText(title, text) {
    const content = title ? `${title}\n\n${text}` : text;
    if (navigator.share) {
      try { await navigator.share({ text: content }); return true; }
      catch (e) { if (e.name !== 'AbortError') { copyText(content); return true; } return false; }
    }
    copyText(content);
    return true;
  }

  // ---------- メモアプリへ一括保存 ----------
  // ショートカット側でこの区切り文字で分割し、1件ずつ「メモを作成」する
  const MEMO_SEPARATOR = '@@@@';

  function markSaved(m) { m.saved = true; delete m.thumb; }

  const unsavedMemos = () => messages.filter(m => m.kind === 'ocr' && m.text && !m.duplicate && !m.saved);

  function updateSaveBar() {
    updateStatus();
    const n = unsavedMemos().length;
    $('unsavedCount').textContent = n;
    $('savebar').classList.toggle('show', n > 0);
  }

  async function saveToNotes(list) {
    if (!list.length) { toast('保存するメモがありません'); return; }
    if (settings.saveMethod === 'shortcut') {
      // 1つのメモにまとめる時は空行で区切る（ショートカット側で分割されないので、1回で1つのメモに入る）
      await copyText(list.map(m => m.text).join(settings.saveJoin === 'each' ? MEMO_SEPARATOR : '\n\n') + '\n', true);
      list.forEach(markSaved);
      saveMessages(); render();
      location.href = 'shortcuts://run-shortcut?name=' + encodeURIComponent(settings.shortcutName) + '&input=clipboard';
    } else {
      const ok = await shareText('', list.map(m => m.text).join('\n\n'));
      if (ok) { list.forEach(markSaved); saveMessages(); render(); }
    }
  }

  $('saveAll').addEventListener('click', () => saveToNotes(unsavedMemos()));

  $('exportAll').addEventListener('click', () => {
    const memos = messages.filter(m => m.kind === 'ocr' && m.text && !m.duplicate);
    if (!memos.length) { toast('書き出すメモがありません'); return; }
    let n = 0;
    const text = memos.map(m => m.quiz
      ? `【${++n}】\n${formatQuiz(m.quiz)}`
      : `■ ${m.title || 'メモ'}（${fmtDate(m.at)}）\n${m.text}`).join('\n\n');
    shareText('', text);
  });

  // ---------- 画像処理 ----------
  async function loadBitmap(file) {
    if ('createImageBitmap' in window) {
      try { return await createImageBitmap(file); } catch { /* fallthrough */ }
    }
    return await new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('画像を読み込めませんでした')); };
      img.src = url;
    });
  }

  // crop: 画像の縦方向の切り出し範囲（0〜1 の割合）
  function drawScaled(src, maxSide, type, quality, crop) {
    const sy = crop ? Math.round(src.height * crop.top) : 0;
    const sh = crop ? Math.round(src.height * (crop.bottom - crop.top)) : src.height;
    const w = src.width, h = sh;
    const scale = Math.min(1, maxSide / Math.max(w, h));
    const c = document.createElement('canvas');
    c.width = Math.round(w * scale); c.height = Math.round(h * scale);
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(src, 0, sy, w, sh, 0, 0, c.width, c.height);
    return c.toDataURL(type, quality);
  }

  // クイズ画面の問題文〜正解が収まる範囲（上部の得点欄と下部のキャラクターを除く）
  const QUIZ_CROP = { top: 0.30, bottom: 0.72 };

  async function prepareFile(file, mode) {
    const bmp = await loadBitmap(file);
    const crop = mode === 'quiz' && bmp.height / bmp.width > 1.6 ? QUIZ_CROP : null;
    const thumb = drawScaled(bmp, 140, 'image/jpeg', 0.55, crop);
    // 縦長のスクショでも文字が潰れないよう長辺 3072px まで
    const full = drawScaled(bmp, 3072, 'image/jpeg', 0.88, crop);
    if (bmp.close) bmp.close();
    return { thumb, base64: full.split(',')[1], cropped: !!crop };
  }

  // ---------- Gemini API ----------
  // 無料枠の「1分あたりの回数制限」を超えないよう、リクエストの間隔をあける
  let nextSlot = 0;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  async function waitTurn() {
    const interval = 60000 / Math.max(1, Number(settings.rpm) || 10);
    const now = Date.now();
    const start = Math.max(now, nextSlot);
    nextSlot = start + interval;
    if (start > now) await sleep(start - now);
  }

  function retryDelayMs(data) {
    const details = (data.error && data.error.details) || [];
    const info = details.find(d => String(d['@type'] || '').endsWith('RetryInfo'));
    const sec = info && parseFloat(info.retryDelay);
    return sec ? sec * 1000 + 1000 : 0;
  }

  async function callGemini(body, attempt = 0) {
    await waitTurn();
    const model = (settings.model || DEFAULT_MODEL).trim().replace(/^models\//, '');
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;
    let res;
    try {
      res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': settings.apiKey.trim() },
        body: JSON.stringify(body)
      });
    } catch {
      throw new Error('通信できませんでした。電波状況を確認してください。');
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      if (res.status === 429) {
        const delay = retryDelayMs(data);
        if (/PerDay/i.test(JSON.stringify(data.error || {})) || delay > 120000) {
          dailyLimitHit = true;
          throw new Error(DAILY_MSG);
        }
      }
      if ((res.status === 429 || res.status >= 500) && attempt < 5) {
        // 回数制限(429)のときは API が指示する時間だけ待ち、他のリクエストも止める
        const wait = res.status === 429 ? (retryDelayMs(data) || 20000 * (attempt + 1)) : 3000 * (attempt + 1);
        if (res.status === 429) nextSlot = Math.max(nextSlot, Date.now() + wait);
        await sleep(wait);
        return callGemini(body, attempt + 1);
      }
      const msg = data.error && data.error.message || `HTTP ${res.status}`;
      if (res.status === 400 && /API key/i.test(msg)) throw new Error('APIキーが正しくありません。設定を確認してください。');
      if (res.status === 403) throw new Error('APIキーが使えません（権限・制限を確認してください）: ' + msg);
      if (res.status === 404) throw new Error(`モデル「${model}」が見つかりません。設定でモデル名を確認してください。`);
      if (res.status === 429) throw new Error('利用上限に達しました（無料枠は1日の回数にも上限があります）。時間をおいて「再試行」を押してください。');
      throw new Error(msg);
    }
    return extractText(data);
  }

  // Gemini の応答 JSON から文字を取り出す（アプリ内でもサーバー経由でも共通）
  function extractText(data) {
    const cand = data.candidates && data.candidates[0];
    const text = cand && cand.content && (cand.content.parts || []).map(p => p.text || '').join('') || '';
    if (!text) {
      const reason = (data.promptFeedback && data.promptFeedback.blockReason) || (cand && cand.finishReason) || '不明';
      throw new Error(`AIから結果が返りませんでした（理由: ${reason}）`);
    }
    return text;
  }

  function generalBody(base64, instruction) {
    return {
      systemInstruction: { parts: [{ text: OCR_SYSTEM }] },
      contents: [{
        role: 'user',
        parts: [
          { inlineData: { mimeType: 'image/jpeg', data: base64 } },
          { text: instruction ? `追加の指示: ${instruction}` : 'このスクリーンショットをテキスト化してください。' }
        ]
      }],
      generationConfig: {
        temperature: 0.1,
        responseMimeType: 'application/json',
        responseSchema: {
          type: 'OBJECT',
          properties: { title: { type: 'STRING' }, text: { type: 'STRING' } },
          required: ['title', 'text']
        }
      }
    };
  }

  function quizBody(base64, instruction) {
    return {
      systemInstruction: { parts: [{ text: QUIZ_SYSTEM }] },
      contents: [{
        role: 'user',
        parts: [
          { inlineData: { mimeType: 'image/jpeg', data: base64 } },
          { text: instruction ? `追加の指示: ${instruction}` : 'このクイズ画面の問題文と正解を読み取ってください。' }
        ]
      }],
      generationConfig: {
        temperature: 0,
        responseMimeType: 'application/json',
        responseSchema: {
          type: 'OBJECT',
          properties: {
            is_quiz: { type: 'BOOLEAN' },
            question: { type: 'STRING' },
            answer: { type: 'STRING' }
          },
          required: ['is_quiz', 'question', 'answer']
        }
      }
    };
  }

  function parseGeneral(raw) {
    try {
      const j = JSON.parse(raw);
      return { title: String(j.title || '').trim(), text: String(j.text || '').trim() };
    } catch {
      return { title: '', text: raw.trim() };
    }
  }

  // クイズ画面でなければ null
  function parseQuiz(raw) {
    let j;
    try { j = JSON.parse(raw); } catch { return null; }
    const q = {
      question: String(j.question || '').replace(/\s*\n\s*/g, '').trim(),
      answer: String(j.answer || '').trim()
    };
    if (j.is_quiz === false || !q.question) return null;
    return q;
  }

  const ocr = async (base64, instruction) => parseGeneral(await callGemini(generalBody(base64, instruction)));
  const ocrQuiz = async (base64, instruction) => parseQuiz(await callGemini(quizBody(base64, instruction)));

  function buildHistory(upto) {
    const recent = messages.slice(0, upto).filter(m => !m.pending && m.kind !== 'error').slice(-30);
    const contents = [];
    for (const m of recent) {
      let role, text;
      if (m.role === 'user') {
        role = 'user';
        text = [m.imageCount ? `（スクリーンショットを${m.imageCount}枚送信）` : '', m.text || ''].filter(Boolean).join('\n');
      } else {
        role = 'model';
        text = m.kind === 'ocr' ? `【メモ: ${m.title || '無題'}】\n${m.text}` : m.text;
      }
      if (!text) continue;
      const last = contents[contents.length - 1];
      if (last && last.role === role) last.parts.push({ text });
      else contents.push({ role, parts: [{ text }] });
    }
    while (contents.length && contents[0].role !== 'user') contents.shift();
    return contents;
  }

  async function chat(modelMsg) {
    const idx = messages.indexOf(modelMsg);
    const contents = buildHistory(idx);
    return callGemini({
      systemInstruction: { parts: [{ text: CHAT_SYSTEM }] },
      contents,
      generationConfig: { temperature: 0.4 }
    });
  }

  // ---------- 送信 ----------
  function setBusy(delta) {
    busy += delta;
    updateSendState();
    updateStatus();
  }

  function updateSendState() {
    sendEl.disabled = busy > 0 || (!inputEl.value.trim() && !pendingFiles.length);
  }

  async function runOcrJob(job) {
    const m = job.msg;
    try {
      if (dailyLimitHit) throw new Error(DAILY_MSG);
      if (!job.base64) {
        const p = await prepareFile(job.file, job.mode);
        Object.assign(job, { base64: p.base64, cropped: p.cropped });
        m.thumb = p.thumb;
      }
      if (job.mode === 'quiz') {
        const quiz = await ocrQuiz(job.base64, job.instruction);
        if (quiz) {
          Object.assign(m, { pending: false, kind: 'ocr', quiz, title: quiz.answer || 'クイズ', text: formatQuiz(quiz) });
          m.duplicate = isDuplicateQuiz(quiz, m);
        } else {
          // クイズ画面ではない → メモにしない（クイズまとめに余計な文章が入らないように）
          Object.assign(m, { pending: false, kind: 'ocr', title: 'クイズ以外', text: '', skip: true });
          delete m.quiz; delete m.duplicate;
        }
      } else {
        const r = await ocr(job.base64, job.instruction);
        Object.assign(m, { pending: false, kind: 'ocr', title: r.title, text: r.text });
        delete m.quiz; delete m.duplicate;
      }
      delete m.retry; delete m._job;
    } catch (e) {
      Object.assign(m, { pending: false, kind: 'error', text: e.message, retry: { type: 'ocr' } });
      m._job = job; // 再試行用（保存はしない）
    } finally {
      job.base64 = null; // 大量処理でもメモリを使い切らないように
    }
    updateMessage(m);
    saveMessages();
  }

  let dailyLimitHit = false;
  const progress = { done: 0, total: 0 };

  // ---------- バックグラウンド解析サーバー（利用者の Google Apps Script） ----------
  // 本文を text/plain で送ると事前確認（CORS プリフライト）が不要になり、Apps Script でも受け取れる
  if (!settings.bgToken) {
    settings.bgToken = (crypto.randomUUID ? crypto.randomUUID() : uid() + uid() + uid()).replace(/-/g, '');
    storage.set(KEY_SETTINGS, settings);
  }
  let serverInfo = null;   // サーバーの件数・上限の情報
  let serverError = '';
  let uploading = false;

  async function callServer(action, payload = {}) {
    if (!settings.bgUrl) throw new Error('サーバーの URL が未設定です');
    const controller = new AbortController();
    const timer = action === 'kick' ? null : setTimeout(() => controller.abort(), 90000);
    let res;
    try {
      res = await fetch(settings.bgUrl, {
        method: 'POST',
        body: JSON.stringify({
          action, token: settings.bgToken,
          ...(action === 'enqueue' ? { appUrl: location.origin + location.pathname } : {}),
          ...payload
        }),
        redirect: 'follow',
        signal: controller.signal
      });
    } catch {
      throw new Error(controller.signal.aborted ? 'サーバーの応答がありませんでした（時間切れ）' : 'サーバーに接続できませんでした（URL と電波状況を確認してください）');
    } finally {
      if (timer) clearTimeout(timer);
    }
    const text = await res.text();
    let json;
    try { json = JSON.parse(text); }
    catch {
      throw new Error(/<html/i.test(text)
        ? 'サーバーの応答がウェブページでした。デプロイの「アクセスできるユーザー」が「全員」か確認してください'
        : `サーバーの応答を読み取れませんでした（${res.status}）`);
    }
    if (!json.ok) throw new Error(json.error || 'サーバーでエラーが発生しました');
    return json;
  }

  // 画像を準備してサーバーに預ける（8枚ずつまとめて送る）。送り終われば閉じてよい
  async function sendRemote(files, instruction) {
    uploading = true;
    progress.done = 0; progress.total = files.length;
    updateStatus();
    keepAwake(true);
    const model = (settings.model || DEFAULT_MODEL).trim().replace(/^models\//, '');
    let sent = 0, failed = 0;
    for (let i = 0; i < files.length; i += 8) {
      const group = [];
      for (const f of files.slice(i, i + 8)) {
        try {
          const p = await prepareFile(f.file, settings.mode);
          const id = uid();
          group.push({
            msg: { id, role: 'model', kind: 'remote', mode: settings.mode, thumb: p.thumb, at: Date.now() },
            job: { id, model, body: settings.mode === 'quiz' ? quizBody(p.base64, instruction) : generalBody(p.base64, instruction) }
          });
        } catch { failed++; }
      }
      let ok = false, lastErr;
      for (let attempt = 0; attempt < 3 && !ok && group.length; attempt++) {
        try { await callServer('enqueue', { jobs: group.map(g => g.job) }); ok = true; }
        catch (e) { lastErr = e; await sleep(2000 * (attempt + 1)); }
      }
      if (ok) {
        group.forEach(g => addMessage(g.msg));
        sent += group.length;
        saveMessages();
      } else if (group.length) {
        failed += group.length;
        addMessage({ id: uid(), role: 'model', kind: 'error', text: `${group.length}枚をサーバーに送れませんでした：${lastErr.message}（もう一度選んで送ってください）`, at: Date.now() });
      }
      progress.done = Math.min(files.length, i + 8);
      updateStatus();
    }
    progress.total = 0;
    uploading = false;
    keepAwake(false);
    if (sent) {
      toast(`${sent}枚をサーバーに預けました。アプリを閉じても解析が続きます`);
      callServer('kick').catch(() => {});   // 1分ごとの起動を待たずに解析を始めてもらう
      setTimeout(pollRemote, 60000);
    }
    if (failed && !sent) toast('サーバーに送れませんでした');
    updateStatus();
  }

  // サーバーの結果を取り込む
  function applyRemoteResult(res) {
    let m = messages.find(x => x.id === res.id);
    if (!m) { m = { id: res.id, role: 'model', at: Date.now() }; messages.push(m); }
    const mode = m.mode || 'quiz';
    delete m.pending;
    try {
      if (!res.ok) {
        const reason = res.status === 400 ? '要求が正しくありませんでした' : `HTTP ${res.status}`;
        throw new Error(`サーバーでの解析に失敗しました（${reason}）。もう一度スクショを送ってください`);
      }
      const raw = extractText(JSON.parse(res.body));
      if (mode === 'quiz') {
        const quiz = parseQuiz(raw);
        if (quiz) {
          Object.assign(m, { kind: 'ocr', quiz, title: quiz.answer || 'クイズ', text: formatQuiz(quiz) });
          m.duplicate = isDuplicateQuiz(quiz, m);
        } else {
          Object.assign(m, { kind: 'ocr', title: 'クイズ以外', text: '', skip: true });
        }
      } else {
        const r = parseGeneral(raw);
        Object.assign(m, { kind: 'ocr', title: r.title, text: r.text });
      }
    } catch (e) {
      Object.assign(m, { kind: 'error', text: e.message });
    }
  }

  let polling = false;
  async function pollRemote() {
    if (!settings.bgUrl || polling) return;
    polling = true;
    let got = 0;
    try {
      for (let round = 0; round < 20; round++) {
        const r = await callServer('results', { limit: 50 });
        serverInfo = r; serverError = '';
        const results = r.results || [];
        if (!results.length) break;
        results.forEach(applyRemoteResult);
        got += results.length;
        saveMessages();
        render();
        await callServer('ack', { ids: results.map(x => x.id) });
        if (results.length < 50) break;
      }
      if (got) { toast(`サーバーから ${got} 件の結果を受け取りました`); scrollToBottom(); }
    } catch (e) {
      serverError = e.message;
    } finally {
      polling = false;
      updateStatus();
    }
  }
  const remoteWaiting = () => messages.filter(m => m.kind === 'remote').length;
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pollRemote(); });
  setInterval(() => {
    if (document.visibilityState === 'visible' && (remoteWaiting() || (serverInfo && serverInfo.ready))) pollRemote();
  }, 30000);

  let statusAction = null;

  function updateStatus() {
    const failed = messages.filter(m => m.kind === 'error' && m._job).length;
    const bar = $('statusbar'), txt = $('statusText'), btn = $('retryAll');
    const waiting = remoteWaiting();
    if (uploading && progress.total) {
      txt.textContent = `サーバーへ送信中 ${progress.done} / ${progress.total} 枚（送り終わるまで開いたままに）`;
      btn.hidden = true;
      bar.classList.add('show');
    } else if (progress.total && progress.done < progress.total) {
      const left = progress.total - progress.done;
      txt.textContent = `解析中 ${progress.done} / ${progress.total} 枚・残り約${Math.ceil(left / (Number(settings.rpm) || 10))}分`;
      btn.hidden = true;
      bar.classList.add('show');
    } else if (failed && !busy) {
      txt.textContent = `読み取れなかった画像 ${failed} 件`;
      btn.textContent = 'まとめて再試行'; statusAction = 'retry';
      btn.hidden = false;
      bar.classList.add('show');
    } else if (waiting) {
      const lim = serverInfo && serverInfo.limit;
      const srvErr = serverInfo && serverInfo.lastError;
      const ago = t => t ? `${Math.max(0, Math.round((Date.now() - t) / 60000))}分前` : 'まだ一度もなし';
      txt.textContent = !settings.bgUrl ? `サーバーで解析待ち ${waiting}件：⚙ でサーバーの URL を入れ直すと受け取れます`
        : serverError ? `サーバーに接続できません：${serverError}`
        : srvErr ? `サーバーで解析待ち ${waiting}件・サーバーでエラー：${srvErr.message}`
        : serverInfo && serverInfo.pending === 0 && serverInfo.ready === 0
          ? `解析待ち ${waiting}件がサーバーに見つかりません（送信が届かなかった可能性）。カードの「取消」で消して、もう一度送ってください`
        : serverInfo && !serverInfo.lastRunAt
          ? `サーバーで解析待ち ${waiting}件・サーバーがまだ一度も解析していません（Apps Script のトリガーを確認してください）`
        : lim && !lim.daily ? `サーバーで解析待ち ${waiting}件・1分あたりの上限のため少し待っています（最後の解析：${ago(serverInfo.lastRunAt)}）`
        : serverError ? `サーバーに接続できません：${serverError}`
        : lim && lim.daily ? `サーバーで解析待ち ${waiting}件・今日の無料枠の上限のため夕方（16〜17時）に自動で再開`
        : `サーバーで解析中 ${waiting}件・約${Math.ceil(waiting / 10)}分（最後の解析：${ago(serverInfo && serverInfo.lastRunAt)}）`;
      btn.textContent = '結果を確認'; statusAction = 'poll';
      btn.hidden = polling;
      bar.classList.add('show');
    } else {
      bar.classList.remove('show');
    }
  }

  // 画像ごとのカードは処理を始めたときに作る（数百枚でも画面が重くならないように）
  async function processJobs(jobs) {
    dailyLimitHit = false;
    progress.done = 0; progress.total = jobs.length;
    updateStatus();
    keepAwake(true);
    const rpm = Number(settings.rpm) || 10;
    if (jobs.length > rpm) toast(`${jobs.length}枚：約${Math.ceil(jobs.length / rpm)}分かかります。画面を開いたままお待ちください`);
    await runPool(jobs, async job => {
      if (job.msg) {
        Object.assign(job.msg, { pending: true, kind: 'ocr' });
        updateMessage(job.msg);
      } else {
        job.msg = { id: uid(), role: 'model', kind: 'ocr', pending: true, thumb: job.thumb, at: Date.now() };
        addMessage(job.msg);
      }
      await runOcrJob(job);
      progress.done++;
      updateStatus();
    });
    progress.total = 0;
    const ok = jobs.filter(j => j.msg.kind === 'ocr').length;
    const dup = jobs.filter(j => j.msg.duplicate).length;
    if (dailyLimitHit) toast(`${ok}枚で今日の上限に達しました。残りは夕方以降に「まとめて再試行」してください`);
    else if (jobs.length > 1) toast(`${ok} / ${jobs.length}枚をテキスト化しました` + (dup ? `（重複 ${dup}件）` : ''));
    updateStatus();
  }

  $('retryAll').addEventListener('click', async () => {
    if (statusAction === 'poll') { pollRemote(); return; }
    const jobs = messages.filter(m => m.kind === 'error' && m._job).map(m => m._job);
    if (!jobs.length || busy) return;
    setBusy(1);
    try { await processJobs(jobs); } finally { setBusy(-1); keepAwake(false); updateStatus(); }
  });

  async function runPool(jobs, worker) {
    let i = 0;
    const runners = Array.from({ length: Math.min(CONCURRENCY, jobs.length) }, async () => {
      while (i < jobs.length) await worker(jobs[i++]);
    });
    await Promise.all(runners);
  }

  let wakeLock = null;
  async function keepAwake(on) {
    try {
      if (on && !wakeLock && navigator.wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      } else if (!on && wakeLock) {
        await wakeLock.release(); wakeLock = null;
      }
    } catch { /* 非対応の端末では何もしない */ }
  }

  async function send() {
    const text = inputEl.value.trim();
    const files = pendingFiles.slice();
    if (!text && !files.length) return;
    if (!settings.apiKey) { toast('先に Gemini APIキーを設定してください'); openSettings(); return; }

    inputEl.value = ''; autoResize();
    pendingFiles = []; renderPending();
    setBusy(1);

    try {
      if (files.length) {
        addMessage({ id: uid(), role: 'user', text, thumbs: files.slice(0, 12).map(f => f.thumb).filter(Boolean), imageCount: files.length, at: Date.now() });
        saveMessages();
        if (settings.bgUrl) await sendRemote(files, text);
        else await processJobs(files.map(f => ({ file: f.file, thumb: f.thumb, instruction: text, mode: settings.mode })));
      } else {
        addMessage({ id: uid(), role: 'user', text, at: Date.now() });
        const msg = { id: uid(), role: 'model', kind: 'text', pending: true, at: Date.now() };
        addMessage(msg);
        saveMessages();
        await runChat(msg);
      }
    } finally {
      setBusy(-1);
      if (busy === 0) keepAwake(false);
      scrollToBottom();
    }
  }

  async function runChat(msg) {
    try {
      const reply = await chat(msg);
      Object.assign(msg, { pending: false, kind: 'text', text: reply.trim() });
      delete msg.retry;
    } catch (e) {
      Object.assign(msg, { pending: false, kind: 'error', text: e.message, retry: { type: 'chat' } });
    }
    updateMessage(msg);
    saveMessages();
  }

  async function retry(m) {
    if (m.retry.type === 'ocr' && !m._job) {
      toast('画像がもう手元にないため、もう一度スクショを送ってください');
      return;
    }
    dailyLimitHit = false;
    setBusy(1);
    m.pending = true;
    m.kind = m.retry.type === 'ocr' ? 'ocr' : 'text';
    updateMessage(m);
    try {
      if (m.retry.type === 'ocr') await runOcrJob(m._job);
      else await runChat(m);
    } finally { setBusy(-1); }
  }

  // ---------- 入力欄 ----------
  function autoResize() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
    updateSendState();
  }
  inputEl.addEventListener('input', autoResize);
  inputEl.addEventListener('keydown', e => {
    // PC では Enter で送信（日本語変換中は除く）。スマホでは改行。
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && matchMedia('(pointer: fine)').matches) {
      e.preventDefault(); if (!sendEl.disabled) send();
    }
  });
  sendEl.addEventListener('click', send);
  $('attach').addEventListener('click', () => fileEl.click());

  fileEl.addEventListener('change', () => {
    const all = Array.from(fileEl.files || []);
    fileEl.value = '';
    if (!all.length) { toast('画像を受け取れませんでした。枚数を減らして（500枚以下）選び直してください'); return; }
    const room = MAX_PER_BATCH - pendingFiles.length;
    if (room <= 0) { toast(`一度に追加できるのは${MAX_PER_BATCH}枚までです`); return; }
    const take = all.slice(0, room);
    pendingFiles.push(...take.map(file => ({ id: uid(), file, thumb: null })));
    if (all.length > take.length) toast(`一度に追加できるのは${MAX_PER_BATCH}枚まで（1日の無料上限の目安）。${take.length}枚を追加しました`);
    renderPending();
  });

  // サムネイルは画面に出す分だけ、1枚ずつ順番に作る
  let thumbQueue = Promise.resolve();
  function thumbLater(p, img) {
    thumbQueue = thumbQueue.then(async () => {
      if (!p.thumb) {
        try {
          const bmp = await loadBitmap(p.file);
          p.thumb = drawScaled(bmp, 180, 'image/jpeg', 0.6);
          if (bmp.close) bmp.close();
        } catch { return; }
      }
      img.src = p.thumb;
    });
  }

  function renderPending() {
    const nodes = pendingFiles.slice(0, PREVIEW).map(p => {
      const img = el('img', { alt: '' });
      if (p.thumb) img.src = p.thumb; else thumbLater(p, img);
      return el('div', { class: 'pend' }, [
        img,
        el('button', { type: 'button', 'aria-label': '取り消す', text: '×', onclick: () => {
          pendingFiles = pendingFiles.filter(x => x.id !== p.id); renderPending();
        } })
      ]);
    });
    if (pendingFiles.length > PREVIEW) {
      nodes.push(el('div', { class: 'pend more', text: `+${pendingFiles.length - PREVIEW}枚`, role: 'button', onclick: () => {
        if (confirm(`選択中の${pendingFiles.length}枚をすべて取り消しますか？`)) { pendingFiles = []; renderPending(); }
      } }));
    }
    pendingEl.replaceChildren(...nodes);
    pendingEl.classList.toggle('show', pendingFiles.length > 0);
    inputEl.placeholder = pendingFiles.length
      ? `${pendingFiles.length}枚を送信（指示は任意）`
      : 'スクショ追加・メッセージ入力';
    updateSendState();
  }

  // ---------- 設定 ----------
  function openSettings() {
    $('apiKey').value = settings.apiKey;
    $('model').value = settings.model || DEFAULT_MODEL;
    $('saveMethod').value = settings.saveMethod;
    $('shortcutName').value = settings.shortcutName;
    $('saveJoin').value = settings.saveJoin || 'one';
    $('rpm').value = settings.rpm;
    $('bgUrl').value = settings.bgUrl;
    $('bgState').textContent = settings.bgUrl ? '接続先が設定されています（送信はサーバー経由になります）' : '未設定（送信はこの画面の中で解析します）';
    dlg.showModal();
  }
  $('openSettings').addEventListener('click', openSettings);
  $('cancelSettings').addEventListener('click', () => dlg.close());
  $('settingsForm').addEventListener('submit', () => {
    settings.apiKey = $('apiKey').value.trim();
    settings.model = $('model').value.trim() || DEFAULT_MODEL;
    settings.saveMethod = $('saveMethod').value;
    settings.shortcutName = $('shortcutName').value.trim() || 'スクショメモ保存';
    settings.saveJoin = $('saveJoin').value;
    settings.rpm = Math.min(1000, Math.max(1, parseInt($('rpm').value, 10) || 10));
    settings.bgUrl = $('bgUrl').value.trim();
    // APIキーを変えたときは、サーバーにも新しいキーを登録する
    if (settings.bgUrl && settings.apiKey) callServer('config', { geminiKey: settings.apiKey }).catch(() => {});
    storage.set(KEY_SETTINGS, settings);
    toast('保存しました');
    if (!messages.length) render();
  });
  // サーバー用コード（同じ場所に置いた apps-script.txt）を先に読んでおき、ボタンで即コピーできるようにする
  let serverCode = '';
  fetch('apps-script.txt').then(r => r.ok ? r.text() : '').then(t => { serverCode = t; }).catch(() => {});
  $('bgCopy').addEventListener('click', async () => {
    if (!serverCode) { toast('コードを読み込めませんでした。電波を確認してもう一度押してください'); return; }
    await copyText(serverCode, true);
    toast('サーバー用コードをコピーしました');
  });
  $('bgTest').addEventListener('click', async () => {
    const url = $('bgUrl').value.trim();
    const key = $('apiKey').value.trim();
    if (!/^https:\/\/script\.google\.com\/macros\/s\//.test(url)) { $('bgState').textContent = 'URL が正しくありません（https://script.google.com/macros/s/…/exec の形です）'; return; }
    if (!key) { $('bgState').textContent = '先に Gemini APIキーを入力してください'; return; }
    $('bgState').textContent = '接続しています…（最大1分ほど）';
    const prevUrl = settings.bgUrl;
    settings.bgUrl = url;
    try {
      const r = await callServer('config', { geminiKey: key });
      settings.apiKey = key;
      storage.set(KEY_SETTINGS, settings);
      $('bgState').textContent = `✓ 接続できました（サーバーで解析待ち ${r.pending || 0}件・受け取り待ち ${r.ready || 0}件）。以後の送信はサーバー経由になります`;
      pollRemote();
    } catch (e) {
      settings.bgUrl = prevUrl;
      $('bgState').textContent = '✗ ' + e.message;
    }
  });
  $('dropSaved').addEventListener('click', () => {
    const n = messages.filter(m => m.saved).length;
    if (!n) { toast('保存済みのメモはありません'); return; }
    if (!confirm(`メモアプリに保存済みの ${n} 件を、このアプリの履歴から消しますか？（メモアプリの中身は消えません。同じ問題をまた送っても「重複」として扱います）`)) return;
    rememberSaved(messages);
    messages = messages.filter(m => !m.saved); saveMessages(); render(); dlg.close();
  });
  $('unsaveAll').addEventListener('click', () => {
    const list = messages.filter(m => m.saved);
    if (!list.length) { toast('保存済みのメモはありません'); return; }
    if (!confirm(`保存済みの ${list.length} 件を、もう一度一括保存の対象に戻しますか？`)) return;
    list.forEach(m => { m.saved = false; }); saveMessages(); render(); dlg.close();
  });
  $('clearAll').addEventListener('click', () => {
    if (!confirm('すべての履歴（メモ）を削除します。よろしいですか？')) return;
    rememberSaved(messages);
    messages = []; saveMessages(); render(); dlg.close();
  });

  function renderMode() {
    document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === settings.mode)));
  }
  document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
    settings.mode = b.dataset.mode;
    storage.set(KEY_SETTINGS, settings);
    renderMode();
    toast(settings.mode === 'quiz' ? 'クイズ形式：問題文と正解だけを読み取ります' : '通常：画面の文字をすべて読み取ります');
  }));
  renderMode();

  render();
  updateSaveBar();
  scrollToBottom();
  pollRemote();
  if (!settings.apiKey) setTimeout(openSettings, 300);
})();
</script>
</body>
</html>
